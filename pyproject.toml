[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interaction-uncertainty"
version = "0.2.0"
description = "Prompt-conditioned evidence-to-interaction bridge for interactive perception research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Interactive Perception Research Team" }]
dependencies = [
  "numpy>=1.24,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "jsonschema>=4.23,<5",
]
pomdp = ["pomdp-py==1.3.5.1"]

[project.scripts]
interaction-uncertainty = "interaction_uncertainty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/interaction-uncertainty/schemas/v2" = ["schemas/v2/*.json"]
"share/interaction-uncertainty/examples/v2" = ["examples/v2/*.json"]
"share/interaction-uncertainty/docs" = ["docs/*.md"]
"share/interaction-uncertainty" = ["references.bib", "CITATION.cff"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
